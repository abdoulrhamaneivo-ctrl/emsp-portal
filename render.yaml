services:
  - type: web
    name: emsp-portal
    runtime: docker
    repo: https://github.com/abdoulrhamaneivo-ctrl/emsp-portal
    branch: main
    region: ohio
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: DOCUMENT_STORAGE_BACKEND
        value: s3
      - key: DOCUMENT_STORAGE_BUCKET
        value: candidate-documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_EXPIRE_MINUTES
        value: "120"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "EMSP · Portail candidat"
      - key: VERIF_ACTIF
        value: "false"
      - key: VERIF_BASE_URL
        sync: false
      - key: VERIF_CLE_API
        sync: false
      - key: VERIF_MODELE
        sync: false
      - key: VERIF_PIECES_MAX
        value: "3"
      - key: VERIF_TIMEOUT_SEC
        value: "60"
      - key: CONSENTEMENT_TIERS_REQUIS
        value: "true"
